<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001a56" />
    <link rel="icon" href="/favicon.ico" sizes="64x64" />

    <!--
      Home-page defaults. Social scrapers do not run JavaScript, so these must be
      present in the static HTML. src/app/head.ts updates them per route at runtime.
    -->
    <title>The Blue Bridge — A global community of professional women from Jodhpur</title>
    <meta
      name="description"
      content="The Blue Bridge connects professional women with Jodhpur roots across generations and geographies — for mentorship, opportunity and community."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Blue Bridge" />
    <meta property="og:title" content="The Blue Bridge" />
    <meta
      property="og:description"
      content="A global community of professional women from Jodhpur — connection, community, confluence."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Two women meeting at the centre of a glowing bridge above the words The Blue Bridge"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Blue Bridge" />
    <meta
      name="twitter:description"
      content="A global community of professional women from Jodhpur — connection, community, confluence."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
